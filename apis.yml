name: Eder Labs
description: >-
  Eder Labs builds infrastructure for using personal data in safer, more human
  ways. Its current focus is Persona, an open-source (MIT) user-memory system for
  AI agents that turns a person's digital footprint into a Graph-Vector hybrid
  personal knowledge graph (Neo4j graph plus vector embeddings) and answers
  natural-language RAG queries or returns structured insights over that memory.
  Eder Labs also develops Fluid, a platform for exchanging sensitive intelligence
  and running data science inside secure enclaves without compromising trust.
  Persona ships as a self-hosted FastAPI service with a small REST API for
  creating users, ingesting content, and querying memory. Eder Labs is backed by
  Accel.
